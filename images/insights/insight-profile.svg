  </defs>

  <!-- Phone Frame & Background -->
  <rect width="400" height="700" rx="28" fill="url(#igDarkBg3)"/>
  <rect x="1" y="1" width="398" height="698" rx="27" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Top Status / Header -->
