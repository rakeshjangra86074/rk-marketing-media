  <text x="32" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">38,940</text>
  <rect x="225" y="128" width="82" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="237" y="145" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+294.1%</text>

