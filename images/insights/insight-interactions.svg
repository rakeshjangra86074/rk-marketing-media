<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <linearGradient id="igDarkBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="goldAccent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4d685"/>
      <stop offset="100%" stop-color="#d3ab55"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame & Background -->
  <rect width="400" height="700" rx="28" fill="url(#igDarkBg2)"/>
  <rect x="1" y="1" width="398" height="698" rx="27" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Top Status / Header -->
