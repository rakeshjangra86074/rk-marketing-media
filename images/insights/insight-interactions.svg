  <text x="32" y="66" fill="#8e8e8e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Last 30 Days • vs previous period</text>
  <line x1="24" y1="84" x2="376" y2="84" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Metric 1: Content Interactions -->
  <text x="32" y="116" fill="#a8a8a8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Total Interactions</text>
  <text x="32" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">482,910</text>
  <rect x="235" y="128" width="82" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="247" y="145" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+346.2%</text>

