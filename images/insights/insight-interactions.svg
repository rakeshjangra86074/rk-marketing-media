  <text x="44" y="246" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Reels Interactions</text>
  <text x="340" y="246" text-anchor="end" fill="#f4d685" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">388,410 (80.4%)</text>
  <rect x="44" y="256" width="312" height="8" rx="4" fill="#242730"/>
  <rect x="44" y="256" width="250" height="8" rx="4" fill="url(#goldAccent2)"/>

  <!-- Post Likes -->
  <text x="44" y="296" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Saves & Bookmarks</text>
  <text x="340" y="296" text-anchor="end" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">54,120 (11.2%)</text>
  <rect x="44" y="306" width="312" height="8" rx="4" fill="#242730"/>
  <rect x="44" y="306" width="40" height="8" rx="4" fill="#ff4b2b"/>

