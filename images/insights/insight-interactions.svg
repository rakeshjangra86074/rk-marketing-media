  <rect x="44" y="406" width="312" height="8" rx="4" fill="#242730"/>
  <rect x="44" y="406" width="12" height="8" rx="4" fill="#10b981"/>

  <!-- Top Reel Spotlight -->
  <rect x="24" y="450" width="352" height="130" rx="16" fill="#14161a" stroke="#22262d" stroke-width="1"/>
  <text x="44" y="482" fill="#a8a8a8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Top Performing Viral Reel</text>
  <text x="44" y="512" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">1.28M Plays • 142K Likes</text>
  <text x="44" y="534" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Average watch time: 88% completion</text>
  <rect x="44" y="546" width="108" height="22" rx="11" fill="rgba(211, 171, 85, 0.15)"/>
  <text x="54" y="561" fill="#f4d685" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">★ VIRAL WINNER</text>

  <!-- Verified Badge Seal -->
  <rect x="24" y="600" width="352" height="70" rx="14" fill="rgba(211, 171, 85, 0.08)" stroke="rgba(211, 171, 85, 0.3)" stroke-width="1"/>
  <circle cx="56" cy="635" r="16" fill="rgba(211, 171, 85, 0.2)"/>
  <path d="M 50 635 L 54 639 L 63 630" fill="none" stroke="#f4d685" stroke-width="2.5" stroke-linecap="round"/>
  <text x="84" y="632" fill="#fff5c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">RK Marketing Media Client Account</text>
  <text x="84" y="650" fill="#d3ab55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Verified High-Retention Production</text>
